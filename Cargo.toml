[package]
name = "tx-pigeon"
version = "0.1.0"
edition = "2024"
default-run = "tx-pigeon"

[dependencies]
anyhow = "1.0.98"
arti-client = { version = "0.30", features = ["onion-service-client"] }
bitcoin = { version = "0.32.5", features = ["serde"] }
clap = { version = "4.5.38", features = ["derive"] }
crossterm = "0.12.1"
data-encoding = "2.9.0"
futures = "0.3.31"
futures-timer = "3.0.3"
hex = "0.4"
rand = "0.9.1"
reqwest = { version = "0.12", features = ["json"] }
rust-mempool = "0.0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha3 = "0.10.8"
tokio = { version = "1", features = ["full"] }
tor-rtcompat = { version = "0.30", features = ["tokio"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
